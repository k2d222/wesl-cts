name: CTS passing tests

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  cts-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout wesl-cts
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout wesl-rs
        uses: actions/checkout@v4
        with:
          repository: webgpu-tools/wesl-rs
          path: wesl-rs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install CLI dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Install wesl-cpu dependencies
        working-directory: wesl-cpu
        run: npm install

      - name: Install cts dependencies
        working-directory: cts
        run: npm ci

      - name: Build wesl-rs-web and cts
        run: |
          node dist/cli.js update wesl --path wesl-rs/crates/wesl-rs-web
          node dist/cli.js update cts

      - name: Run passing tests
        id: passing
        run: node dist/cli.js run --tests passing_tests.txt 2>&1 | tee passing.log
        shell: bash

      - name: Run failing tests (expected to fail)
        id: failing
        run: node dist/cli.js run --tests failing_tests.txt --expect-fail 2>&1 | tee failing.log
        shell: bash

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly CTS run failed in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            if [ "${{ steps.passing.outcome }}" = "failure" ]; then
              echo "## Passing tests report"
              echo
              echo '```'
              tail -n 100 passing.log || true
              echo '```'
              echo
            fi
            if [ "${{ steps.failing.outcome }}" = "failure" ]; then
              echo "## Failing tests report (expected to fail)"
              echo
              echo '```'
              tail -n 100 failing.log || true
              echo '```'
              echo
            fi
          } > issue-body.md
          gh issue create \
            --title "Weekly CTS run failed ($(date -u +%Y-%m-%d))" \
            --body-file issue-body.md
